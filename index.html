<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parlee Beach Volleyball Club - Sub Player Request</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Clean, modern resets to make the embed look fully native */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevents double scrollbars on the outer browser window */
      background-color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }

    /* Container holding the frame */
    .embed-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .nav-bar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
      z-index: 10;
    }

    .brand-logo {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .back-link {
      font-size: 13px;
      font-weight: 600;
      color: #1a73e8;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #1557b0;
    }

    /* The actual Google Apps Script web app iframe */
    iframe {
      width: 100%;
      flex-grow: 1;
      border: none;
      background-color: #f8fafc;
    }

    /* Custom high-end loading screen while Google wakes up */
    .initial-load {
      position: absolute;
      top: 57px; /* Matches the navbar height exactly */
      left: 0;
      width: 100%;
      bottom: 0;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 5;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #1a73e8;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loaded .initial-load {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="embed-container" id="wrapper">
    <nav class="nav-bar">
      <div class="brand-logo">Parlee Beach Volleyball League — Spares</div>
    </nav>

   
    <!-- Custom loader hides automatically when the iframe signals it has finished loading -->
    <div class="initial-load" id="loader">
      <div class="spinner"></div>
      <div class="loading-text">CONNECTING TO SPARE LOGIC...</div>
    </div>

    <!-- 
      Google Web App Iframe
      IMPORTANT: Replace 'YOUR_PUBLIC_WEB_APP_EXEC_URL' with your real Google Web App URL (ending in /exec)
    -->
    <iframe 
      id="app-frame"
      src="https://script.google.com/a/macros/simplifiedworkflows.com/s/AKfycbwG6THAEnD59hOkzoi5lJH-nUFuVUoT_vz4rR2_Fk6apj2cthiHoTsubK5sfNM3Ac9bIA/exec" 
      onload="onFrameLoaded()">
    </iframe>

  </div>

  <script>
    // Removes the placeholder loader only when Google Apps Script is fully mounted
    function onFrameLoaded() {
      document.getElementById('wrapper').classList.add('loaded');
    }
  </script>
</body>
</html>
